name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include credentials, real hostnames, or real dataset
        names. Redact them before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The tool you called and the arguments you passed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: '2.5.0'
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: '22.11.0'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Run with LOG_LEVEL=debug. Logs go to stderr.
      render: shell
